version: '3.8'

services:
  # 1) MySQL 数据库（含 01_base_schema 与 02_backend_schema 自动初始化）
  mysql:
    image: mysql:8.0
    container_name: vg-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_voice_pass_change_me
      MYSQL_DATABASE: voice_gateway
      MYSQL_USER: voice
      MYSQL_PASSWORD: voice_pass_change_me
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db:/docker-entrypoint-initdb.d:ro
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "voice", "-pvoice_pass_change_me"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - voice-net

  # 2) Redis（实时权威余额与锁）
  redis:
    image: redis:7-alpine
    container_name: vg-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 192M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - voice-net

  # 3) 业务后端 (Node.js Express API - 端口 9100)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: voice-backend:latest
    container_name: vg-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=voice
      - DB_PASSWORD=voice_pass_change_me
      - DB_NAME=voice_gateway
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=9100
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - voice-net

  # 4) TXW818 语音网关 (WebSocket Server - 端口 8080)
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: voice-gateway:latest
    container_name: vg-gateway
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8080
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - voice-net

  # 5) Angular 前端单页应用 (极轻量 Nginx 容器)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: voice-frontend:latest
    container_name: vg-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - voice-net

  # 6) 统一公网接入网关 (Nginx 反向代理 + TLS + WSS Upgrade)
  nginx:
    image: nginx:alpine
    container_name: vg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - gateway
    deploy:
      resources:
        limits:
          memory: 192M
    networks:
      - voice-net

networks:
  voice-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:

